# Beekey Medics on your own Ubuntu server (same behaviour as vercel.json).
#   sudo apt install nginx certbot python3-certbot-nginx
#   sudo mkdir -p /var/www/beekey && sudo rsync -a --delete \
#        --exclude android --exclude ios --exclude node_modules --exclude www --exclude supabase \
#        ./ /var/www/beekey/
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/beekey && sudo ln -s ../sites-available/beekey /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d your-domain.com      # free HTTPS (needed for GPS & the installable app)
server {
    listen 80;
    server_name your-domain.com;
    root /var/www/beekey;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    location = /sw.js            { add_header Cache-Control "no-cache"; }
    location ~ ^/(js|css)/       { add_header Cache-Control "public, max-age=0, must-revalidate"; }
    location /assets/            { add_header Cache-Control "public, max-age=604800"; }
    location ~ /\.               { deny all; }   # .git, .env …
    location ~ ^/(android|ios|node_modules|supabase|scripts|resources|www)/ { return 404; }

    location / { try_files $uri $uri/ /index.html; }
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
