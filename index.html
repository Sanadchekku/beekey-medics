<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Beekey Medics — Medicines, Doctors & Lab Tests</title>
  <meta name="description" content="Order medicines from nearby pharmacies, consult doctors online over Google Meet and book lab tests at the best price — all in one hive." />
  <meta name="theme-color" content="#0f0d08" />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Reusable logo symbol: honey bee wearing a stethoscope -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <clipPath id="bee-body-clip"><ellipse cx="32" cy="40" rx="13" ry="16" /></clipPath>
      <linearGradient id="bee-wing" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity=".95" />
        <stop offset="1" stop-color="#cfe9ff" stop-opacity=".7" />
      </linearGradient>
      <linearGradient id="bee-honey" x1="0" x2="1" y1="0" y2="1">
        <stop offset="0" stop-color="#ffd84a" />
        <stop offset="1" stop-color="#f5a800" />
      </linearGradient>
    </defs>
    <symbol id="logo-bee" viewBox="0 0 64 64">
      <!-- wings -->
      <ellipse cx="21" cy="22" rx="10" ry="13" transform="rotate(-28 21 22)" fill="url(#bee-wing)" stroke="#16130c" stroke-width="2" />
      <ellipse cx="43" cy="22" rx="10" ry="13" transform="rotate(28 43 22)" fill="url(#bee-wing)" stroke="#16130c" stroke-width="2" />
      <!-- body -->
      <ellipse cx="32" cy="40" rx="13" ry="16" fill="url(#bee-honey)" />
      <g clip-path="url(#bee-body-clip)" fill="#16130c">
        <rect x="16" y="35" width="32" height="4.5" />
        <rect x="16" y="44" width="32" height="4.5" />
      </g>
      <ellipse cx="32" cy="40" rx="13" ry="16" fill="none" stroke="#16130c" stroke-width="2.4" />
      <path d="M32 56 l-2.4 5 h4.8z" fill="#16130c" />
      <!-- head -->
      <circle cx="32" cy="20" r="8.5" fill="#16130c" />
      <circle cx="29" cy="19" r="1.8" fill="#fff" />
      <circle cx="35" cy="19" r="1.8" fill="#fff" />
      <path d="M29 23.5 q3 2.2 6 0" stroke="#ffd84a" stroke-width="1.4" fill="none" stroke-linecap="round" />
      <!-- antennae -->
      <path d="M28 13 q-3 -7 -8 -8" stroke="#16130c" stroke-width="2" fill="none" stroke-linecap="round" />
      <path d="M36 13 q3 -7 8 -8" stroke="#16130c" stroke-width="2" fill="none" stroke-linecap="round" />
      <circle cx="20" cy="5" r="2.2" fill="#ffd84a" stroke="#16130c" stroke-width="1.4" />
      <circle cx="44" cy="5" r="2.2" fill="#ffd84a" stroke="#16130c" stroke-width="1.4" />
      <!-- stethoscope -->
      <path d="M24.5 24 C 21 33, 22 41, 29 45 C 36 48.5, 43 46, 46 40" stroke="#e8e8e8" stroke-width="2.6" fill="none" stroke-linecap="round" />
      <path d="M24.5 24 C 21 33, 22 41, 29 45 C 36 48.5, 43 46, 46 40" stroke="#16130c" stroke-width="1" fill="none" stroke-linecap="round" stroke-dasharray="0.1 3.2" />
      <path d="M39.5 24 C 43 29, 46 33, 46 40" stroke="#e8e8e8" stroke-width="2.6" fill="none" stroke-linecap="round" />
      <circle cx="46.5" cy="43" r="4.6" fill="#c9ccd1" stroke="#16130c" stroke-width="2" />
      <circle cx="46.5" cy="43" r="2" fill="#ffd84a" />
    </symbol>
  </svg>

  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar" id="topbar"></header>
  <main id="main" class="page" tabindex="-1"></main>
  <footer class="footer" id="footer"></footer>
  <nav class="tabbar" id="tabbar" aria-label="Primary"></nav>

  <dialog id="modal" class="modal"></dialog>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
